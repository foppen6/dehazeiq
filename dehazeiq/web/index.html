<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeHazeIQ – AI-powered video editing, without the hassle</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/logo.png">
<meta name="theme-color" content="#0B0F14">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img class="logo-img" src="/static/logo.png" alt="" width="32" height="32">
      <span class="brand-name">DeHaze<em>IQ</em></span>
      <span class="ver" id="ver"></span>
      <span class="crumb" id="crumb"></span>
    </div>
    <nav class="steps" id="steps" aria-label="Arbetsflöde"></nav>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div id="view" class="layout"></div>
</div>
<div id="jobbar" class="jobbar" hidden>
  <div class="line"><b id="jobTitle">Arbetar …</b><span class="num muted" id="jobPct"></span></div>
  <div class="bar"><div id="jobFill" style="width:0%"></div></div>
  <div class="muted" id="jobMsg" style="font-size:12px"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" class="modal" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>

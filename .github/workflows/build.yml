name: Bygg installationsfiler

# Bygger DeHazeIQ.dmg (Mac, Apple Silicon) och DeHazeIQ-Setup.exe (Windows).
# Varje push till main ger nedladdningsbara filer under Actions.
# En tagg som v0.3.0 skapar dessutom en Release med filerna.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Mac (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta FFmpeg
        run: bash packaging/get_ffmpeg_mac.sh

      - name: Hämta llama.cpp (djupanalys)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p llz packaging/llama
          # senaste utgåvan som har en färdig Mac-version (arm64)
          tag=""; asset=""
          for t in $(gh release list --repo ggml-org/llama.cpp --limit 30 --json tagName --jq '.[].tagName'); do
            names=$(gh release view "$t" --repo ggml-org/llama.cpp --json assets --jq '.assets[].name')
            asset=$(echo "$names" | grep -i 'macos' | grep -i 'arm64' | grep -iv 'xcframework\|kleidiai' | grep -i '\.zip$\|\.tar\.gz$' | head -1)
            if [ -n "$asset" ]; then tag=$t; break; fi
          done
          echo "Valt: $tag / $asset"
          [ -n "$asset" ] || { echo "Ingen Mac-version av llama.cpp hittades"; exit 1; }
          gh release download "$tag" --repo ggml-org/llama.cpp --pattern "$asset" -D llz
          cd llz
          for f in *; do case "$f" in *.zip) unzip -q "$f";; *.tar.gz) tar xzf "$f";; esac; done
          find . -maxdepth 4 | head -50
          srv=$(find . -name llama-server -type f | head -1)
          echo "llama-server: $srv"
          cp -R "$(dirname "$srv")"/. ../packaging/llama/
          cd ..
          ls -la packaging/llama | head -40
          packaging/llama/llama-server --version

      - name: Bygg whisper.cpp (tal till text)
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build wcpp/build -j 4 --config Release --target whisper-cli
          mkdir -p packaging/whisper
          cp wcpp/build/bin/whisper-cli packaging/whisper/
          otool -L packaging/whisper/whisper-cli
          packaging/whisper/whisper-cli --version

      - name: Hämta AI-modell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # modellpaketet kan byggas om samtidigt: försök igen tills alla filer finns
          need="clip_vision.onnx text_embeds.npz prompts.json bioclip_vision.onnx bio_text.npz bio_species.json clip_text.onnx clip_tokenizer.json"
          for i in $(seq 1 40); do
            gh release download models-v1 --dir packaging/models --repo "${{ github.repository }}" --clobber || true
            ok=1; for f in $need; do [ -s "packaging/models/$f" ] || ok=0; done
            [ $ok = 1 ] && break
            echo "Väntar på modellpaketet ($i)…"; sleep 30
          done
          ls -la packaging/models
          for f in $need; do [ -s "packaging/models/$f" ] || { echo "Saknas: $f"; exit 1; }; done

      - name: Installera Python-paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Bygg appen
        run: pyinstaller --noconfirm --clean packaging/dehazeiq.spec

      - name: Signera (ad hoc)
        run: codesign --force --deep -s - dist/DeHazeIQ.app

      - name: Självtest av den byggda appen
        run: dist/DeHazeIQ.app/Contents/MacOS/DeHazeIQ --selftest

      - name: Test av djupanalysen med en liten modell (Qwen3.5 4B)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install -r requirements.txt
          DEHAZEIQ_LLAMA="$(find dist/DeHazeIQ.app -name llama-server | head -1)" python tests/vlm_test.py

      - name: Test av tal till text (Whisper base)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          DEHAZEIQ_WHISPER="$(find dist/DeHazeIQ.app -name whisper-cli | head -1)" python tests/whisper_test.py

      - name: Skapa DMG
        run: |
          mkdir -p dmg
          cp -R dist/DeHazeIQ.app dmg/
          ln -s /Applications dmg/Program
          hdiutil create -volname DeHazeIQ -srcfolder dmg -ov -format UDZO DeHazeIQ-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DeHazeIQ-mac
          path: DeHazeIQ-mac.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx -Force
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Get-ChildItem ffx -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination packaging/ffmpeg
          packaging/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Bygg whisper.cpp (tal till text)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wcpp/build -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build wcpp/build -j 4 --config Release --target whisper-cli
          mkdir -p packaging/whisper
          cp wcpp/build/bin/Release/whisper-cli.exe packaging/whisper/
          packaging/whisper/whisper-cli.exe --version

      - name: Hämta AI-modell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # modellpaketet kan byggas om samtidigt: försök igen tills alla filer finns
          need="clip_vision.onnx text_embeds.npz prompts.json bioclip_vision.onnx bio_text.npz bio_species.json clip_text.onnx clip_tokenizer.json"
          for i in $(seq 1 40); do
            gh release download models-v1 --dir packaging/models --repo "${{ github.repository }}" --clobber || true
            ok=1; for f in $need; do [ -s "packaging/models/$f" ] || ok=0; done
            [ $ok = 1 ] && break
            echo "Väntar på modellpaketet ($i)…"; sleep 30
          done
          ls -la packaging/models
          for f in $need; do [ -s "packaging/models/$f" ] || { echo "Saknas: $f"; exit 1; }; done

      - name: Installera Python-paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Bygg appen
        run: pyinstaller --noconfirm --clean packaging/dehazeiq.spec

      - name: Självtest av den byggda appen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DeHazeIQ\DeHazeIQ.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path dehazeiq-selftest.log) { Get-Content dehazeiq-selftest.log }
          exit $p.ExitCode

      - name: Test av tal till text (Whisper base)
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          pip install -r requirements.txt
          DEHAZEIQ_WHISPER="$(pwd)/$(find dist/DeHazeIQ -name whisper-cli.exe | head -1)" python tests/whisper_test.py

      - name: Skapa installationsprogram
        shell: pwsh
        run: |
          $v = (Select-String -Path dehazeiq/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\DeHazeIQ.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DeHazeIQ-windows
          path: Output/DeHazeIQ-Setup.exe

  release:
    name: Skapa release
    # Varje lyckat bygge på main uppdaterar releasen för aktuell version (v + __version__)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Läs version
        id: ver
        run: echo "v=$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' dehazeiq/__init__.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: DeHazeIQ ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            files/DeHazeIQ-mac.dmg
            files/DeHazeIQ-Setup.exe
          body: |
            **Mac (Apple Silicon):** ladda ner `DeHazeIQ-mac.dmg`, öppna den och dra DeHazeIQ till Program.
            Första gången: Systeminställningar › Integritet och säkerhet › *Öppna ändå*.

            **Windows:** ladda ner och kör `DeHazeIQ-Setup.exe`.
            Varnar SmartScreen: *Mer information* › *Kör ändå*.

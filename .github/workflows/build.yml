name: Bygg installationsfiler

# Bygger DeHazeIQ.dmg (Mac, Apple Silicon) och DeHazeIQ-Setup.exe (Windows).
# Varje push till main ger nedladdningsbara filer under Actions.
# En tagg som v0.3.0 skapar dessutom en Release med filerna.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Mac (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta FFmpeg
        run: bash packaging/get_ffmpeg_mac.sh

      - name: Hämta AI-modell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download models-v1 --dir packaging/models --repo "${{ github.repository }}" --clobber

      - name: Installera Python-paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Bygg appen
        run: pyinstaller --noconfirm --clean packaging/dehazeiq.spec

      - name: Signera (ad hoc)
        run: codesign --force --deep -s - dist/DeHazeIQ.app

      - name: Självtest av den byggda appen
        run: dist/DeHazeIQ.app/Contents/MacOS/DeHazeIQ --selftest

      - name: Skapa DMG
        run: |
          mkdir -p dmg
          cp -R dist/DeHazeIQ.app dmg/
          ln -s /Applications dmg/Program
          hdiutil create -volname DeHazeIQ -srcfolder dmg -ov -format UDZO DeHazeIQ-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DeHazeIQ-mac
          path: DeHazeIQ-mac.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx -Force
          New-Item -ItemType Directory -Force packaging/ffmpeg | Out-Null
          Get-ChildItem ffx -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination packaging/ffmpeg
          packaging/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Hämta AI-modell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download models-v1 --dir packaging/models --repo "${{ github.repository }}" --clobber

      - name: Installera Python-paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Bygg appen
        run: pyinstaller --noconfirm --clean packaging/dehazeiq.spec

      - name: Självtest av den byggda appen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DeHazeIQ\DeHazeIQ.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path dehazeiq-selftest.log) { Get-Content dehazeiq-selftest.log }
          exit $p.ExitCode

      - name: Skapa installationsprogram
        shell: pwsh
        run: |
          $v = (Select-String -Path dehazeiq/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\DeHazeIQ.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DeHazeIQ-windows
          path: Output/DeHazeIQ-Setup.exe

  release:
    name: Skapa release
    # Varje lyckat bygge på main uppdaterar releasen för aktuell version (v + __version__)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Läs version
        id: ver
        run: echo "v=$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' dehazeiq/__init__.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: DeHazeIQ ${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            files/DeHazeIQ-mac.dmg
            files/DeHazeIQ-Setup.exe
          body: |
            **Mac (Apple Silicon):** ladda ner `DeHazeIQ-mac.dmg`, öppna den och dra DeHazeIQ till Program.
            Första gången: Systeminställningar › Integritet och säkerhet › *Öppna ändå*.

            **Windows:** ladda ner och kör `DeHazeIQ-Setup.exe`.
            Varnar SmartScreen: *Mer information* › *Kör ändå*.

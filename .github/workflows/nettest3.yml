name: nettest3
on:
  push:
    branches: [nettest3]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in ggml-org/Qwen3.6-35B-A3B-GGUF unsloth/Qwen3.6-35B-A3B-GGUF unsloth/gemma-4-26B-A4B-it-GGUF ggml-org/gemma-4-E4B-it-GGUF unsloth/Qwen3.5-9B-GGUF unsloth/Qwen3.5-4B-GGUF ggml-org/Qwen3.6-27B-GGUF ggerganov/whisper.cpp; do
            echo "== $r"; curl -s "https://huggingface.co/api/models/$r?blobs=true" > m.json; python3 - <<'PY'
          import json
          d=json.load(open('m.json'))
          if 'error' in d: print(d)
          else:
              fs=[(s['rfilename'], round((s.get('size') or 0)/2**30,2)) for s in d.get('siblings',[])]
              print(len(fs), [f for f in fs if 'mmproj' in f[0].lower()][:4])
              print([f for f in fs if ('Q4_K_M' in f[0] or 'large-v3-turbo' in f[0] or 'Q8_0' in f[0]) and 'mmproj' not in f[0]][:8])
          PY
          done
          echo "== whisper releases"; curl -s https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['tag_name'],[a['name'] for a in d['assets']])"

name: Bygg AI-modellpaket

# Hämtar CLIP-modellen och räknar fram textinbäddningar. Resultatet läggs som
# filer i releasen "models-v1", som byggjobbet för appen hämtar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/ai_prompts.json
      - packaging/build_models.py
      - .github/workflows/models.yml

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera paket
        run: pip install numpy onnxruntime tokenizers

      - name: Bygg modellpaket
        run: python packaging/build_models.py

      - name: Publicera som release-filer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models-v1 >/dev/null 2>&1 || \
            gh release create models-v1 --title "AI-modeller (intern)" --notes "Används av byggsystemet. Ladda inte ner." --prerelease --target "$GITHUB_SHA"
          gh release upload models-v1 packaging/models/* --clobber
